name: ProcessMind AI — CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-eval:
    name: Backend Pytest & EvalGuard Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy python-multipart pypdf python-docx openpyxl httpx pytest pytest-asyncio openai langgraph

      - name: Generate Enterprise SOP Samples & Ground-Truth Labels
        run: |
          ./.venv/bin/python data/generate_sample_files.py

      - name: Run Pytest Unit, Edge-Case, API Integration, and EvalGuard Tests
        env:
          LLM_PROVIDER: mock
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          ./.venv/bin/pytest -v

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Check & Production Bundle Build
        working-directory: frontend
        run: npm run build
